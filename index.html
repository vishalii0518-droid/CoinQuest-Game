<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Quest | Adventure Game</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:flex;justify-content:center;align-items:center;
  background:linear-gradient(135deg,#10152f,#25265a,#402b67);
  color:#fff;font-family:Arial,sans-serif
}
.game{width:min(760px,100%)}
h1{margin:0;font-size:34px;letter-spacing:2px}
h1 span{color:#ffd65a}
.sub{color:#c3c8e8;margin:8px 0 20px}
.stats{display:flex;gap:8px;margin-bottom:12px}
.stat{
  flex:1;text-align:center;padding:12px 5px;
  background:#ffffff12;border:1px solid #ffffff20;border-radius:12px
}
.stat small{display:block;color:#c3c8e8;margin-bottom:5px}
.stat strong{font-size:18px}
canvas{
  display:block;width:100%;height:auto;
  border:2px solid #7775c8;border-radius:16px;
  background:#171b3b;touch-action:none
}
.controls{
  display:flex;justify-content:center;align-items:center;
  gap:8px;margin-top:14px;flex-wrap:wrap
}
button{
  border:0;border-radius:12px;padding:13px 17px;
  font-size:15px;font-weight:bold;cursor:pointer;
  touch-action:manipulation
}
.move{
  background:#ffffff20;color:#fff;
  border:1px solid #ffffff35;min-width:53px;font-size:22px
}
#start{background:#ffd65a;color:#242047}
.note{text-align:center;color:#c4c9e8;font-size:13px;line-height:1.7}
</style>
</head>

<body>
<main class="game">
  <h1>COIN <span>QUEST</span> ✦</h1>
  <p class="sub">Collect the gold. Dodge the danger. Become a legend.</p>

  <div class="stats">
    <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
    <div class="stat"><small>COINS LEFT</small><strong id="left">10</strong></div>
    <div class="stat"><small>LIVES</small><strong id="lives">❤️❤️❤️</strong></div>
  </div>

  <canvas id="game" width="720" height="420"></canvas>

  <div class="controls">
    <button class="move" id="up" aria-label="Move up">▲</button>
    <button class="move" id="left" aria-label="Move left">◀</button>
    <button id="start">START GAME</button>
    <button class="move" id="right" aria-label="Move right">▶</button>
    <button class="move" id="down" aria-label="Move down">▼</button>
  </div>

  <p class="note">
    Keyboard: Arrow keys or WASD<br>
    Collect all 10 coins and avoid the purple enemies!
  </p>
</main>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const W=720,H=420;

let player,coins,enemies,score,lives;
let running=false,ended=false,won=false;
let keys={},last=0,animation=0,invincible=0;

function reset(){
  player={x:W/2,y:H/2,r:15,speed:250};
  coins=[];
  enemies=[];
  score=0;
  lives=3;
  running=false;
  ended=false;
  won=false;
  invincible=0;
  keys={};

  // Create 10 coins spread across the entire game area.
  for(let i=0;i<10;i++){
    coins.push({
      x:35+Math.random()*(W-70),
      y:35+Math.random()*(H-70),
      r:11,
      taken:false
    });
  }

  // Create enemies away from the starting player.
  for(let i=0;i<4;i++){
    let x,y;
    do{
      x=50+Math.random()*(W-100);
      y=50+Math.random()*(H-100);
    }while(Math.hypot(x-player.x,y-player.y)<100);

    enemies.push({
      x,y,r:15,
      vx:(Math.random()<0.5?-1:1)*(75+Math.random()*45),
      vy:(Math.random()<0.5?-1:1)*(55+Math.random()*45)
    });
  }

  $("start").textContent="START GAME";
  updateStats();
  draw();
}

function updateStats(){
  $("score").textContent=score;
  $("left").textContent=10-score;
  $("lives").textContent=
    "❤️".repeat(lives)+"🖤".repeat(3-lives);
}

function circle(x,y,r,color){
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#171b3b";
  ctx.fillRect(0,0,W,H);

  // Background grid.
  ctx.strokeStyle="#ffffff0c";
  ctx.lineWidth=1;

  for(let x=0;x<W;x+=40){
    ctx.beginPath();
    ctx.moveTo(x,0);
    ctx.lineTo(x,H);
    ctx.stroke();
  }

  for(let y=0;y<H;y+=40){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  // Draw coins.
  coins.forEach(c=>{
    if(c.taken)return;

    circle(c.x,c.y,c.r+6,"#ffd65a25");
    circle(c.x,c.y,c.r,"#ffd65a");
    circle(c.x,c.y,c.r-4,"#ffad35");

    ctx.fillStyle="#fff0a5";
    ctx.fillRect(c.x-2,c.y-6,4,12);
  });

  // Draw enemies.
  enemies.forEach(e=>{
    circle(e.x,e.y,e.r+4,"#ef55d329");
    circle(e.x,e.y,e.r,"#e653d1");

    circle(e.x-5,e.y-3,3,"white");
    circle(e.x+5,e.y-3,3,"white");
    circle(e.x-5,e.y-3,1.5,"#252047");
    circle(e.x+5,e.y-3,1.5,"#252047");
  });

  // Draw player.
  if(invincible<=0||Math.floor(performance.now()/100)%2===0){
    circle(player.x,player.y,player.r+4,"#62f5c455");
    circle(player.x,player.y,player.r,"#62f5c4");
    circle(player.x,player.y,player.r-6,"#e2fff5");
    circle(player.x+4,player.y-3,3,"#253b57");
  }

  // Start, win and game-over overlays.
  if(!running){
    ctx.fillStyle="#080b20bb";
    ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";

    ctx.fillStyle="#ffd65a";
    ctx.font="bold 30px Arial";
    ctx.fillText(
      won?"YOU WIN! ✦":ended?"GAME OVER":"READY, EXPLORER?",
      W/2,H/2-20
    );

    ctx.fillStyle="white";
    ctx.font="16px Arial";
    ctx.fillText(
      won?"All 10 coins collected!":
      ended?"Try again and beat your score!":
      "Press START GAME to begin",
      W/2,H/2+18
    );

    ctx.textAlign="left";
  }
}

function start(){
  if(running)return;

  if(ended||won)reset();

  running=true;
  last=0;
  $("start").textContent="RESTART";

  cancelAnimationFrame(animation);
  animation=requestAnimationFrame(loop);
}

function loop(time){
  if(!running)return;

  const dt=Math.min((time-(last||time))/1000,0.035);
  last=time;

  if(invincible>0)invincible-=dt;

  // Four-direction movement.
  let dx=
    (keys.ArrowRight||keys.d||keys.D?1:0)-
    (keys.ArrowLeft||keys.a||keys.A?1:0);

  let dy=
    (keys.ArrowDown||keys.s||keys.S?1:0)-
    (keys.ArrowUp||keys.w||keys.W?1:0);

  // Normalize diagonal movement.
  const length=Math.hypot(dx,dy)||1;

  player.x+=dx/length*player.speed*dt;
  player.y+=dy/length*player.speed*dt;

  // Keep player inside the game area.
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  // Move enemies and check collisions.
  for(const e of enemies){
    e.x+=e.vx*dt;
    e.y+=e.vy*dt;

    if(e.x<e.r||e.x>W-e.r)e.vx*=-1;
    if(e.y<e.r||e.y>H-e.r)e.vy*=-1;

    if(
      invincible<=0&&
      Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r
    ){
      lives--;
      invincible=1.3;
      updateStats();

      if(lives<=0){
        finish(false);
        return;
      }
    }
  }

  // Collect coins anywhere on the canvas.
  coins.forEach(c=>{
    if(
      !c.taken&&
      Math.hypot(player.x-c.x,player.y-c.y)<player.r+c.r+3
    ){
      c.taken=true;
      score++;
      updateStats();
    }
  });

  if(score>=10){
    finish(true);
    return;
  }

  draw();
  animation=requestAnimationFrame(loop);
}

function finish(victory){
  running=false;
  ended=!victory;
  won=victory;
  $("start").textContent="PLAY AGAIN";
  keys={};
  draw();
}

// Keyboard controls.
document.addEventListener("keydown",e=>{
  if([
    "ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "
  ].includes(e.key)){
    e.preventDefault();
  }

  keys[e.key]=true;

  if(e.key===" "&&!running)start();
});

document.addEventListener("keyup",e=>{
  keys[e.key]=false;
});

// Hold buttons for smooth movement.
function hold(button,key){
  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
    button.setPointerCapture?.(e.pointerId);
  });

  ["pointerup","pointerleave","pointercancel","lostpointercapture"]
    .forEach(evt=>{
      button.addEventListener(evt,()=>{
        keys[key]=false;
      });
    });
}

hold($("up"),"ArrowUp");
hold($("down"),"ArrowDown");
hold($("left"),"ArrowLeft");
hold($("right"),"ArrowRight");

$("start").addEventListener("click",start);

reset();
</script>
</body>
</html>
